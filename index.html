<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебная Платформа</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .hidden { display: none !important; }
        
        /* Формы */
        .card { background: #16213e; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 10px 0; background: #0f3460; border: 1px solid #e94560; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { background: #e94560; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #ff2e63; }

        /* Меню */
        .nav { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .nav button { background: #0f3460; flex: 1; }
        .nav button.active { background: #e94560; }

        /* Карта игры (адаптация вашего файла) */
        .game-map { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 15px; }
        .level-card { background: #0f3460; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .level-card:hover { transform: translateY(-5px); border-color: #e94560; }
        .level-card.locked { background: #2a2a40; color: #666; cursor: not-allowed; }
        .level-num { font-size: 24px; font-weight: bold; }
        .level-block { font-size: 12px; color: #aaa; margin-top: 5px;}

        /* Списки уроков и материалов */
        .list-item { background: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .list-item a { color: #4bcffa; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- ЭКРАН ЛОГИНА -->
    <div id="loginScreen" class="card" style="max-width: 400px; margin: 50px auto;">
        <h2>Вход в систему</h2>
        <input type="text" id="loginInput" placeholder="Логин">
        <input type="password" id="passInput" placeholder="Пароль">
        <button onclick="doLogin()">Войти</button>
        <p id="loginError" style="color: red; text-align: center;"></p>
    </div>

    <!-- ЛИЧНЫЙ КАБИНЕТ -->
    <div id="cabinet" class="hidden">
        <div class="nav">
            <button onclick="showSection('game')" id="btn-game" class="active">🎮 Игра</button>
            <button onclick="showSection('lessons')" id="btn-lessons">📚 Уроки</button>
            <button onclick="showSection('materials')" id="btn-materials">📝 Материалы</button>
            <button onclick="showSection('admin')" id="btn-admin">⚙️ Админ (Добавить)</button>
            <button onclick="logout()" style="background: #555;">Выйти</button>
        </div>

        <!-- РАЗДЕЛ ИГРА -->
        <div id="section-game" class="card">
            <h2>🎮 Карта уровней</h2>
            <div class="game-map" id="gameMapContainer">
                <!-- Уровни подгрузятся сюда -->
            </div>
        </div>

        <!-- РАЗДЕЛ УРОКИ -->
        <div id="section-lessons" class="card hidden">
            <h2>📚 Уроки</h2>
            <div id="lessonsList"></div>
        </div>

        <!-- РАЗДЕЛ МАТЕРИАЛЫ -->
        <div id="section-materials" class="card hidden">
            <h2>📝 Конспекты и материалы</h2>
            <div id="materialsList"></div>
        </div>

        <!-- АДМИН ПАНЕЛЬ (ОТВЕТ НА ВОПРОС "КУДА ДОБАВЛЯТЬ?") -->
        <div id="section-admin" class="card hidden">
            <h2>⚙️ Добавление контента</h2>
            
            <h3>Добавить слово/задание в Игру</h3>
            <input type="number" id="addLevel" placeholder="Номер уровня (1-100)">
            <input type="text" id="addBlock" placeholder="Название блока (напр. 'Еда')">
            <input type="text" id="addWord" placeholder="Слово / Вопрос">
            <input type="text" id="addTask" placeholder="Задание / Перевод">
            <button onclick="addContent('addGameContent', ['addLevel', 'addBlock', 'addWord', 'addTask'])">Добавить в игру</button>
            <hr style="border-color: #333; margin: 20px 0;">

            <h3>Добавить Урок (ссылка на Диск)</h3>
            <input type="text" id="addLessonTitle" placeholder="Название урока">
            <input type="text" id="addLessonLink" placeholder="Ссылка на Google Диск">
            <button onclick="addContent('addLesson', ['addLessonTitle', 'addLessonLink'])">Добавить урок</button>
            <hr style="border-color: #333; margin: 20px 0;">

            <h3>Добавить Материал (Конспект)</h3>
            <input type="text" id="addMatTitle" placeholder="Заголовок конспекта">
            <textarea id="addMatContent" placeholder="Текст конспекта" rows="4"></textarea>
            <button onclick="addContent('addMaterial', ['addMatTitle', 'addMatContent'])">Добавить материал</button>
            
            <p id="adminMsg" style="color: #4bcffa; margin-top: 15px;"></p>
        </div>
    </div>
</div>

<script>
    // ВСТАВЬТЕ СЮДА URL ВАШЕГО ВЕБ-ПРИЛОЖЕНИЯ ИЗ GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbzFuMNUX6dFmx6qe7Kh8EG9RngtyBvgdJ3ycu9rpXnumFEOR5rGHe7UY4hJB9qSgf-I2w/exec"; 

    // --- ЛОГИКА АВТОРИЗАЦИИ ---
    async function doLogin() {
    const login = document.getElementById('loginInput').value;
    const pass = document.getElementById('passInput').value;
    const errorBox = document.getElementById('loginError');
    
    errorBox.innerText = '⏳ Проверяю...';
    errorBox.style.color = '#4bcffa';
    
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'login', login, password: pass })
        });
        const text = await response.text();
        console.log('Сырой ответ от сервера:', text); // для консоли
        
        let res;
        try {
            res = JSON.parse(text);
        } catch(e) {
            errorBox.style.color = 'red';
            errorBox.innerText = '❌ Сервер вернул не JSON. Проверьте URL (должен заканчиваться на /exec) и доступ "Все".\n\nОтвет: ' + text.substring(0, 200);
            return;
        }
        
        if (res.success) {
            errorBox.style.color = 'green';
            errorBox.innerText = res.message;
            setTimeout(() => {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('cabinet').classList.remove('hidden');
                showSection('game');
            }, 800);
        } else {
            errorBox.style.color = 'red';
            errorBox.innerText = res.message;
        }
    } catch (e) {
        errorBox.style.color = 'red';
        errorBox.innerText = '❌ Ошибка сети: ' + e.message + '\n\nПроверьте:\n1. Правильность URL\n2. Доступ "Все" в настройках развертывания';
    }
}


    // --- НАВИГАЦИЯ ---
    function showSection(name) {
        ['game', 'lessons', 'materials', 'admin'].forEach(s => {
            document.getElementById('section-' + s).classList.add('hidden');
            document.getElementById('btn-' + s).classList.remove('active');
        });
        document.getElementById('section-' + name).classList.remove('hidden');
        document.getElementById('btn-' + name).classList.add('active');

        if (name === 'game') loadGameMap();
        if (name === 'lessons') loadList('Lessons', 'lessonsList', 'lesson');
        if (name === 'materials') loadList('Materials', 'materialsList', 'material');
    }

    // --- ЗАГРУЗКА ДАННЫХ ---
    async function loadGameMap() {
        const res = await fetchAPI({ action: 'getData', table: 'Game' });
        const container = document.getElementById('gameMapContainer');
        container.innerHTML = '';
        
        // Генерируем 100 уровней (как в вашем файле)
        for (let i = 1; i <= 100; i++) {
            // Ищем задания для этого уровня в таблице
            const levelTasks = res.data.filter(d => parseInt(d.level) === i);
            const hasTasks = levelTasks.length > 0;
            
            const card = document.createElement('div');
            card.className = `level-card ${hasTasks ? '' : 'locked'}`;
            card.innerHTML = `
                <div class="level-num">${i}</div>
                <div class="level-block">${hasTasks ? levelTasks[0].block : 'Закрыто'}</div>
            `;
            if(hasTasks) {
                card.onclick = () => alert(`Уровень ${i}\nСлова: ${levelTasks.map(t=>t.word).join(', ')}`);
            }
            container.appendChild(card);
        }
    }

    async function loadList(tableName, containerId, type) {
        const res = await fetchAPI({ action: 'getData', table: tableName });
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        
        res.data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item';
            if (type === 'lesson') {
                div.innerHTML = `<span>${item.title}</span> <a href="${item.link}" target="_blank"><button>Открыть</button></a>`;
            } else {
                div.innerHTML = `<div><b>${item.title}</b><br><small>${item.content}</small></div>`;
            }
            container.appendChild(div);
        });
    }

    // --- ДОБАВЛЕНИЕ КОНТЕНТА (АДМИНКА) ---
    async function addContent(action, fields) {
        let payload = { action };
        fields.forEach(f => payload[f.replace('add', '').toLowerCase()] = document.getElementById(f).value);
        
        // Чистим имена полей для бэкенда (упрощение)
        if(action === 'addGameContent') payload = { action, level: document.getElementById('addLevel').value, block: document.getElementById('addBlock').value, word: document.getElementById('addWord').value, task: document.getElementById('addTask').value };
        if(action === 'addLesson') payload = { action, title: document.getElementById('addLessonTitle').value, link: document.getElementById('addLessonLink').value };
        if(action === 'addMaterial') payload = { action, title: document.getElementById('addMatTitle').value, content: document.getElementById('addMatContent').value };

        const res = await fetchAPI(payload);
        document.getElementById('adminMsg').innerText = res.message || 'Готово!';
        
        // Очищаем поля
        fields.forEach(f => document.getElementById(f).value = '');
    }

    // --- УНИВЕРСАЛЬНАЯ ФУНКЦИЯ ЗАПРОСА ---
    async function fetchAPI(payload) {
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            return await response.json();
        } catch (e) {
            console.error(e);
            return { success: false, message: 'Ошибка сети. Проверьте URL API.' };
        }
    }
</script>
</body>
</html>
